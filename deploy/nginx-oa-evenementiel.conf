# /etc/nginx/sites-available/oa-evenementiel.fr
# HTTPS is added by certbot (DEPLOIEMENT.md). The app redirects www itself.
server {
    listen 80;
    server_name oa-evenementiel.fr www.oa-evenementiel.fr;

    # Photos and videos uploaded from the admin.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
